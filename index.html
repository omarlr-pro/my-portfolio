<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Laraje | Data Scientist & BI Engineer</title>
    <meta name="description" content="Portfolio of Omar Laraje, a Business Intelligence and Data Science engineering student building BI dashboards, ML models, and data-driven applications.">
    <meta name="keywords" content="Omar Laraje, Data Science, Business Intelligence, Power BI, Machine Learning, Portfolio">
    <meta name="author" content="Omar Laraje">
    <link rel="canonical" href="https://omarlr-pro.github.io/my-portfolio/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Omar Laraje | Data Scientist & BI Engineer">
    <meta property="og:description" content="Explore Omar Laraje's BI, data science, machine learning, and software projects.">
    <meta property="og:image" content="assets/social-preview.svg">
    <meta property="og:url" content="https://omarlr-pro.github.io/my-portfolio/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Omar Laraje | Data Scientist & BI Engineer">
    <meta name="twitter:description" content="BI, data science, machine learning, and software engineering portfolio.">
    <meta name="twitter:image" content="assets/social-preview.svg">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20261013-logos">
</head>

<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Scroll to Top Button -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Back to top" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>

    <!-- Chatbot Widget -->
    <div class="chatbot-widget" id="chatbotWidget">
        <button id="chatbotToggle" class="chatbot-toggle" aria-label="Open chatbot" title="Ask me anything">
            <svg class="chatbot-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4.5 3V17H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"
                    fill="currentColor"></path>
            </svg>
        </button>

        <div id="chatbotPanel" class="chatbot-panel" aria-hidden="true">
            <div class="chatbot-header">
                <h3 data-translate="chatbot.title">Ask Omar AI</h3>
                <div class="chatbot-header-actions">
                    <button id="chatbotEnd" class="chatbot-end" type="button" data-translate="chatbot.endChat">End
                        chat</button>
                    <button id="chatbotClose" class="chatbot-close" aria-label="Close chatbot">×</button>
                </div>
            </div>

            <p id="chatbotNotice" class="chatbot-notice" aria-live="polite"></p>

            <div id="chatbotMessages" class="chatbot-messages"></div>

            <form id="chatbotForm" class="chatbot-input-wrap">
                <input id="chatbotInput" class="chatbot-input" type="text"
                    data-translate-placeholder="chatbot.placeholder"
                    placeholder="Ask about Omar's projects, skills, or experience..." autocomplete="off" maxlength="500" required />
                <button id="chatbotSend" class="chatbot-send" type="submit" data-translate="chatbot.send">Send</button>
            </form>
        </div>
    </div>

    <!-- Sections loaded dynamically -->
    <div id="nav-section"></div>
    <div id="hero-section"></div>
    <div id="about-section"></div>
    <div id="skills-section"></div>
    <div id="projects-section"></div>
    <div id="experience-section"></div>
    <div id="education-section"></div>
    <div id="certifications-section"></div>
    <div id="contact-section"></div>
    <div id="footer-section"></div>

    <script>
        window.CHATBOT_CONFIG = {
            apiUrl: '/api/chatbot',
            siteUrl: window.location.origin,
            siteName: 'Omar Portfolio',
            transcriptRecipientEmail: 'laromar77@gmail.com',
            transcriptWebhookUrl: 'https://formspree.io/f/mreanolv',
            contactWebhookUrl: 'https://formspree.io/f/mreanolv'
        };

        async function loadSection(elementId, filePath) {
            const target = document.getElementById(elementId);
            if (!target) return false;

            target.setAttribute('aria-busy', 'true');

            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                target.innerHTML = await response.text();
                return true;
            } catch (_) {
                target.innerHTML = '<section class="section-load-error" role="status">This section could not be loaded.</section>';
                return false;
            } finally {
                target.removeAttribute('aria-busy');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const translationsScript = document.createElement('script');
            translationsScript.src = './translations.js?v=20261013';

            translationsScript.onload = async () => {
                await Promise.all([
                    loadSection('nav-section', 'sections/nav.html'),
                    loadSection('hero-section', 'sections/hero.html'),
                    loadSection('about-section', 'sections/about.html'),
                    loadSection('skills-section', 'sections/skills.html'),
                    loadSection('projects-section', 'sections/projects_dynamic.html'),
                    loadSection('experience-section', 'sections/experience.html'),
                    loadSection('education-section', 'sections/education_dynamic.html'),
                    loadSection('certifications-section', 'sections/certifications.html'),
                    loadSection('contact-section', 'sections/contact.html'),
                    loadSection('footer-section', 'sections/footer.html')
                ]);

                document.dispatchEvent(new CustomEvent('sectionsLoaded'));

                const script = document.createElement('script');
                script.src = './script.js?v=20261013';
                script.defer = true;
                document.body.appendChild(script);
            };

            translationsScript.onerror = () => {
                document.body.insertAdjacentHTML('beforeend', '<p class="section-load-error" role="status">Translations could not be loaded.</p>');
            };

            document.body.appendChild(translationsScript);
        });
    </script>
</body>

</html>
