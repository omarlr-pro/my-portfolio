services:
  - type: web
    name: omar-portfolio-chat-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://omarlr-pro.github.io/my-portfolio
      - key: OPENROUTER_SITE_NAME
        value: Omar Portfolio
      - key: FRONTEND_ORIGINS
        value: https://omarlr-pro.github.io,https://omarlr-pro.github.io/my-portfolio
